org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.overridePathCheck=true
# KSP 2.2.10 still registers generated sources through kotlin.sourceSets. AGP 9 built-in
# Kotlin accepts that bridge only when this temporary compatibility switch is explicit.
android.disallowKotlinSourceSets=false
kotlin.code.style=official
# Keep CI/Codex builds inside Gradle's writable process; the standalone Kotlin
# daemon otherwise targets the host user's protected AppData directory.
kotlin.compiler.execution.strategy=in-process
